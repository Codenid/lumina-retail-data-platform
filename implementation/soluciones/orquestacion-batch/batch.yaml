main:
  params: [args]
  steps:
    - initialize:
        assign:
          - project: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - dataset: ${default(args.dataset, "{{PREFIX}}_gold")}
          - run_id: ${default(args.run_id, "demo001")}
          - silver_prefix: "MERGE `{{PROJECT_ID}}.{{PREFIX}}_silver.pedidos` T USING (SELECT JSON_VALUE(payload_json,'$.order_id') order_id, JSON_VALUE(payload_json,'$.order_line_id') order_line_id, JSON_VALUE(payload_json,'$.customer_id') customer_id, JSON_VALUE(payload_json,'$.store_id') store_id, JSON_VALUE(payload_json,'$.warehouse_id') warehouse_id, COALESCE(JSON_VALUE(payload_json,'$.sku_id'), JSON_VALUE(payload_json,'$.product_id')) sku_id, SAFE_CAST(JSON_VALUE(payload_json,'$.quantity') AS INT64) quantity, effective_at occurred_at, IF(is_valid,'VALID','INVALID') quality_status FROM `{{PROJECT_ID}}.{{PREFIX}}_bronze.pedidos_raw` WHERE batch_id='"
          - silver_suffix: "') S ON T.order_id=S.order_id AND COALESCE(T.order_line_id,'')=COALESCE(S.order_line_id,'') WHEN NOT MATCHED THEN INSERT ROW"
    - bronze_to_silver:
        call: googleapis.bigquery.v2.jobs.query
        args:
          projectId: ${project}
          body:
            useLegacySql: false
            query: ${silver_prefix + run_id + silver_suffix}
    - inventory_to_silver:
        call: googleapis.bigquery.v2.jobs.query
        args:
          projectId: ${project}
          body:
            useLegacySql: false
            query: ${"MERGE `{{PROJECT_ID}}.{{PREFIX}}_silver.inventario` T USING (SELECT CONCAT(batch_id,':',file_id,':',CAST(source_row_number AS STRING)) snapshot_id,JSON_VALUE(payload_json,'$.warehouse_id') warehouse_id,JSON_VALUE(payload_json,'$.store_id') store_id,JSON_VALUE(payload_json,'$.sku_id') sku_id,SAFE_CAST(JSON_VALUE(payload_json,'$.on_hand_qty') AS INT64) on_hand_qty,SAFE_CAST(JSON_VALUE(payload_json,'$.reserved_qty') AS INT64) reserved_qty,effective_at,IF(is_valid AND SAFE_CAST(JSON_VALUE(payload_json,'$.on_hand_qty') AS INT64)>=SAFE_CAST(JSON_VALUE(payload_json,'$.reserved_qty') AS INT64),'VALID','INVALID') quality_status FROM `{{PROJECT_ID}}.{{PREFIX}}_bronze.inventario_raw` WHERE batch_id='" + run_id + "') S ON T.snapshot_id=S.snapshot_id WHEN NOT MATCHED THEN INSERT ROW"}
    - delivery_to_silver:
        call: googleapis.bigquery.v2.jobs.query
        args:
          projectId: ${project}
          body:
            useLegacySql: false
            query: ${"MERGE `{{PROJECT_ID}}.{{PREFIX}}_silver.entregas` T USING (SELECT JSON_VALUE(payload_json,'$.delivery_id') delivery_id,JSON_VALUE(payload_json,'$.order_id') order_id,JSON_VALUE(payload_json,'$.store_id') store_id,JSON_VALUE(payload_json,'$.region_id') region_id,SAFE_CAST(JSON_VALUE(payload_json,'$.promised_at') AS TIMESTAMP) promised_at,SAFE_CAST(JSON_VALUE(payload_json,'$.delivered_at') AS TIMESTAMP) delivered_at,SAFE_CAST(JSON_VALUE(payload_json,'$.delivery_cost') AS NUMERIC) delivery_cost,IF(is_valid AND SAFE_CAST(JSON_VALUE(payload_json,'$.delivery_cost') AS NUMERIC)>=0,'VALID','INVALID') quality_status FROM `{{PROJECT_ID}}.{{PREFIX}}_bronze.entregas_raw` WHERE batch_id='" + run_id + "') S ON T.delivery_id=S.delivery_id WHEN NOT MATCHED THEN INSERT ROW"}
    - competitor_to_silver:
        call: googleapis.bigquery.v2.jobs.query
        args:
          projectId: ${project}
          body:
            useLegacySql: false
            query: ${"MERGE `{{PROJECT_ID}}.{{PREFIX}}_silver.benchmark_competidores` T USING (SELECT JSON_VALUE(payload_json,'$.benchmark_id') benchmark_id,JSON_VALUE(payload_json,'$.competitor_id') competitor_id,JSON_VALUE(payload_json,'$.sku_id') sku_id,JSON_VALUE(payload_json,'$.store_id') store_id,SAFE_CAST(JSON_VALUE(payload_json,'$.observed_at') AS TIMESTAMP) observed_at,SAFE_CAST(JSON_VALUE(payload_json,'$.competitor_price') AS NUMERIC) competitor_price,JSON_VALUE(payload_json,'$.availability') availability,IF(is_valid AND SAFE_CAST(JSON_VALUE(payload_json,'$.competitor_price') AS NUMERIC)>0,'VALID','INVALID') quality_status FROM `{{PROJECT_ID}}.{{PREFIX}}_bronze.benchmark_competidores_raw` WHERE batch_id='" + run_id + "') S ON T.benchmark_id=S.benchmark_id WHEN NOT MATCHED THEN INSERT ROW"}
    - local_event_to_silver:
        call: googleapis.bigquery.v2.jobs.query
        args:
          projectId: ${project}
          body:
            useLegacySql: false
            query: ${"MERGE `{{PROJECT_ID}}.{{PREFIX}}_silver.eventos_locales` T USING (SELECT JSON_VALUE(payload_json,'$.local_event_id') local_event_id,JSON_VALUE(payload_json,'$.store_id') store_id,JSON_VALUE(payload_json,'$.event_type') event_type,SAFE_CAST(JSON_VALUE(payload_json,'$.start_at') AS TIMESTAMP) start_at,SAFE_CAST(JSON_VALUE(payload_json,'$.end_at') AS TIMESTAMP) end_at,SAFE_CAST(JSON_VALUE(payload_json,'$.impact_score') AS FLOAT64) impact_score,IF(is_valid AND SAFE_CAST(JSON_VALUE(payload_json,'$.impact_score') AS FLOAT64) BETWEEN 0 AND 1,'VALID','INVALID') quality_status FROM `{{PROJECT_ID}}.{{PREFIX}}_bronze.eventos_locales_raw` WHERE batch_id='" + run_id + "') S ON T.local_event_id=S.local_event_id WHEN NOT MATCHED THEN INSERT ROW"}
    - social_to_silver:
        call: googleapis.bigquery.v2.jobs.query
        args:
          projectId: ${project}
          body:
            useLegacySql: false
            query: ${"MERGE `{{PROJECT_ID}}.{{PREFIX}}_silver.redes_sociales` T USING (SELECT JSON_VALUE(payload_json,'$.post_id') post_id,JSON_VALUE(payload_json,'$.platform') platform,SAFE_CAST(JSON_VALUE(payload_json,'$.published_at') AS TIMESTAMP) published_at,JSON_VALUE(payload_json,'$.sku_id') sku_id,SAFE_CAST(JSON_VALUE(payload_json,'$.sentiment_score') AS FLOAT64) sentiment_score,SAFE_CAST(JSON_VALUE(payload_json,'$.engagement_count') AS INT64) engagement_count,JSON_VALUE(payload_json,'$.text_hash') text_hash,IF(is_valid AND SAFE_CAST(JSON_VALUE(payload_json,'$.sentiment_score') AS FLOAT64) BETWEEN -1 AND 1 AND SAFE_CAST(JSON_VALUE(payload_json,'$.engagement_count') AS INT64)>=0,'VALID','INVALID') quality_status FROM `{{PROJECT_ID}}.{{PREFIX}}_bronze.redes_sociales_raw` WHERE batch_id='" + run_id + "') S ON T.post_id=S.post_id WHEN NOT MATCHED THEN INSERT ROW"}
    - gold_cu03:
        call: googleapis.bigquery.v2.jobs.query
        args:
          projectId: ${project}
          body:
            useLegacySql: false
            query: ${"DELETE FROM `{{PROJECT_ID}}.{{PREFIX}}_gold.cu01_riesgo_quiebre_despacho` WHERE scenario_id='" + run_id + "'; INSERT INTO `{{PROJECT_ID}}.{{PREFIX}}_gold.cu01_riesgo_quiebre_despacho` SELECT '" + run_id + "',i.sku_id,i.store_id,CAST(GREATEST(0,1-SAFE_DIVIDE(i.on_hand_qty-i.reserved_qty,NULLIF(i.on_hand_qty,0))) AS FLOAT64),i.on_hand_qty-i.reserved_qty,IF(i.on_hand_qty-i.reserved_qty<12,'REPOSICIONAR/DESPACHAR','MONITOREAR'),i.effective_at FROM `{{PROJECT_ID}}.{{PREFIX}}_silver.inventario` i JOIN `{{PROJECT_ID}}.{{PREFIX}}_silver.pedidos` p USING(sku_id) WHERE i.snapshot_id IN (SELECT CONCAT(batch_id,':',file_id,':',CAST(source_row_number AS STRING)) FROM `{{PROJECT_ID}}.{{PREFIX}}_bronze.inventario_raw` WHERE batch_id='" + run_id + "') AND p.order_id IN (SELECT JSON_VALUE(payload_json,'$.order_id') FROM `{{PROJECT_ID}}.{{PREFIX}}_bronze.pedidos_raw` WHERE batch_id='" + run_id + "') AND i.quality_status='VALID' AND p.quality_status='VALID'; DELETE FROM `{{PROJECT_ID}}.{{PREFIX}}_gold.cu02_plan_reposicion` WHERE scenario_id='" + run_id + "'; INSERT INTO `{{PROJECT_ID}}.{{PREFIX}}_gold.cu02_plan_reposicion` SELECT '" + run_id + "',p.sku_id,i.warehouse_id,DATE(p.occurred_at),SUM(p.quantity),GREATEST(0,SUM(p.quantity)-(i.on_hand_qty-i.reserved_qty)),IF(i.on_hand_qty-i.reserved_qty<SUM(p.quantity),'HIGH','NORMAL') FROM `{{PROJECT_ID}}.{{PREFIX}}_silver.pedidos` p JOIN `{{PROJECT_ID}}.{{PREFIX}}_silver.inventario` i USING(sku_id) WHERE p.order_id IN (SELECT JSON_VALUE(payload_json,'$.order_id') FROM `{{PROJECT_ID}}.{{PREFIX}}_bronze.pedidos_raw` WHERE batch_id='" + run_id + "') AND i.snapshot_id IN (SELECT CONCAT(batch_id,':',file_id,':',CAST(source_row_number AS STRING)) FROM `{{PROJECT_ID}}.{{PREFIX}}_bronze.inventario_raw` WHERE batch_id='" + run_id + "') AND p.quality_status='VALID' AND i.quality_status='VALID' GROUP BY p.sku_id,i.warehouse_id,DATE(p.occurred_at),i.on_hand_qty,i.reserved_qty; DELETE FROM `{{PROJECT_ID}}.{{PREFIX}}_gold.cu03_kpis_operativos` WHERE scenario_id='" + run_id + "'; INSERT INTO `{{PROJECT_ID}}.{{PREFIX}}_gold.cu03_kpis_operativos` SELECT '" + run_id + "',CURRENT_DATE(),'batch',COUNT(DISTINCT p.order_id),SUM(p.quantity),CAST(NULL AS FLOAT64),COALESCE(SUM(e.delivery_cost),0),SAFE_DIVIDE(COUNTIF(e.delivered_at IS NOT NULL),COUNT(e.delivery_id)) FROM `{{PROJECT_ID}}.{{PREFIX}}_silver.pedidos` p LEFT JOIN `{{PROJECT_ID}}.{{PREFIX}}_silver.entregas` e USING(order_id) WHERE p.order_id IN (SELECT JSON_VALUE(payload_json,'$.order_id') FROM `{{PROJECT_ID}}.{{PREFIX}}_bronze.pedidos_raw` WHERE batch_id='" + run_id + "') AND p.quality_status='VALID'"}
    - materialize_mart:
        call: googleapis.bigquery.v2.jobs.query
        args:
          projectId: ${project}
          body:
            useLegacySql: false
            query: ${"DELETE FROM `{{PROJECT_ID}}.{{PREFIX}}_gold.operational_mart` WHERE scenario_id='" + run_id + "'; INSERT INTO `{{PROJECT_ID}}.{{PREFIX}}_gold.operational_mart` (scenario_id,entity_type,entity_id,sku_id,store_id,warehouse_id,quantity,status,observed_at,ingestion_mode,source_domain,correlation_id,measure_value,attributes) SELECT '" + run_id + "','ORDER',order_id,sku_id,store_id,warehouse_id,quantity,quality_status,occurred_at,'batch','pedidos',CAST(NULL AS STRING),CAST(quantity AS FLOAT64),TO_JSON(STRUCT(order_line_id,customer_id)) FROM `{{PROJECT_ID}}.{{PREFIX}}_silver.pedidos` WHERE quality_status='VALID' AND order_id IN (SELECT JSON_VALUE(payload_json,'$.order_id') FROM `{{PROJECT_ID}}.{{PREFIX}}_bronze.pedidos_raw` WHERE batch_id='" + run_id + "'); INSERT INTO `{{PROJECT_ID}}.{{PREFIX}}_gold.operational_mart` (scenario_id,entity_type,entity_id,sku_id,store_id,warehouse_id,quantity,status,observed_at,ingestion_mode,source_domain,correlation_id,measure_value,attributes) SELECT '" + run_id + "','INVENTORY',snapshot_id,sku_id,store_id,warehouse_id,on_hand_qty-reserved_qty,quality_status,effective_at,'batch','inventario',CAST(NULL AS STRING),CAST(on_hand_qty-reserved_qty AS FLOAT64),TO_JSON(STRUCT(on_hand_qty,reserved_qty)) FROM `{{PROJECT_ID}}.{{PREFIX}}_silver.inventario` WHERE quality_status='VALID' AND snapshot_id IN (SELECT CONCAT(batch_id,':',file_id,':',CAST(source_row_number AS STRING)) FROM `{{PROJECT_ID}}.{{PREFIX}}_bronze.inventario_raw` WHERE batch_id='" + run_id + "'); INSERT INTO `{{PROJECT_ID}}.{{PREFIX}}_gold.operational_mart` (scenario_id,entity_type,entity_id,sku_id,store_id,warehouse_id,quantity,status,observed_at,ingestion_mode,source_domain,correlation_id,measure_value,attributes) SELECT '" + run_id + "','DELIVERY',e.delivery_id,p.sku_id,e.store_id,p.warehouse_id,p.quantity,IF(e.delivered_at IS NULL,'PENDING','DELIVERED'),COALESCE(e.delivered_at,e.promised_at),'batch','entregas',e.order_id,CAST(e.delivery_cost AS FLOAT64),TO_JSON(STRUCT(e.region_id,e.promised_at,e.delivered_at,e.delivery_cost)) FROM `{{PROJECT_ID}}.{{PREFIX}}_silver.entregas` e LEFT JOIN `{{PROJECT_ID}}.{{PREFIX}}_silver.pedidos` p ON p.order_id=e.order_id AND p.quality_status='VALID' WHERE e.quality_status='VALID' AND e.delivery_id IN (SELECT JSON_VALUE(payload_json,'$.delivery_id') FROM `{{PROJECT_ID}}.{{PREFIX}}_bronze.entregas_raw` WHERE batch_id='" + run_id + "'); INSERT INTO `{{PROJECT_ID}}.{{PREFIX}}_gold.operational_mart` (scenario_id,entity_type,entity_id,sku_id,store_id,warehouse_id,quantity,status,observed_at,ingestion_mode,source_domain,correlation_id,measure_value,attributes) SELECT '" + run_id + "','COMPETITOR_PRICE',benchmark_id,sku_id,store_id,CAST(NULL AS STRING),CAST(NULL AS INT64),availability,observed_at,'batch','benchmark_competidores',CAST(NULL AS STRING),CAST(competitor_price AS FLOAT64),TO_JSON(STRUCT(competitor_id,competitor_price,availability)) FROM `{{PROJECT_ID}}.{{PREFIX}}_silver.benchmark_competidores` WHERE quality_status='VALID' AND benchmark_id IN (SELECT JSON_VALUE(payload_json,'$.benchmark_id') FROM `{{PROJECT_ID}}.{{PREFIX}}_bronze.benchmark_competidores_raw` WHERE batch_id='" + run_id + "'); INSERT INTO `{{PROJECT_ID}}.{{PREFIX}}_gold.operational_mart` (scenario_id,entity_type,entity_id,sku_id,store_id,warehouse_id,quantity,status,observed_at,ingestion_mode,source_domain,correlation_id,measure_value,attributes) SELECT '" + run_id + "','LOCAL_EVENT',local_event_id,CAST(NULL AS STRING),store_id,CAST(NULL AS STRING),CAST(NULL AS INT64),event_type,start_at,'batch','eventos_locales',CAST(NULL AS STRING),impact_score,TO_JSON(STRUCT(event_type,start_at,end_at,impact_score)) FROM `{{PROJECT_ID}}.{{PREFIX}}_silver.eventos_locales` WHERE quality_status='VALID' AND local_event_id IN (SELECT JSON_VALUE(payload_json,'$.local_event_id') FROM `{{PROJECT_ID}}.{{PREFIX}}_bronze.eventos_locales_raw` WHERE batch_id='" + run_id + "'); INSERT INTO `{{PROJECT_ID}}.{{PREFIX}}_gold.operational_mart` (scenario_id,entity_type,entity_id,sku_id,store_id,warehouse_id,quantity,status,observed_at,ingestion_mode,source_domain,correlation_id,measure_value,attributes) SELECT '" + run_id + "','SOCIAL_POST',post_id,sku_id,CAST(NULL AS STRING),CAST(NULL AS STRING),engagement_count,quality_status,published_at,'batch','redes_sociales',CAST(NULL AS STRING),sentiment_score,TO_JSON(STRUCT(platform,sentiment_score,engagement_count,text_hash)) FROM `{{PROJECT_ID}}.{{PREFIX}}_silver.redes_sociales` WHERE quality_status='VALID' AND post_id IN (SELECT JSON_VALUE(payload_json,'$.post_id') FROM `{{PROJECT_ID}}.{{PREFIX}}_bronze.redes_sociales_raw` WHERE batch_id='" + run_id + "')"}
    - verify_gold_tables:
        call: googleapis.bigquery.v2.jobs.query
        args:
          projectId: ${project}
          body:
            useLegacySql: false
            maximumBytesBilled: "31457280"
            query: ${"SELECT COUNT(*) AS filas FROM `" + project + "." + dataset + ".operational_mart` WHERE scenario_id = '" + run_id + "'"}
        result: verification
    - return_result:
        return:
          workflow: "retailsmart-batch"
          run_id: ${run_id}
          dataset: ${dataset}
          verification: ${verification}
