<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lumina Retail · Centro de operaciones</title>
  <link rel="stylesheet" href="styles.css">
  <style>.sidebar nav{display:grid;gap:16px}.nav-group{display:grid;gap:5px}.nav-group-label{padding:0 12px 4px;color:#8fb1b0;font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:800}.nav-group summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center}.nav-group summary::-webkit-details-marker{display:none}.nav-group-chevron{font-size:14px;transition:transform .2s}.nav-group[open] .nav-group-chevron{transform:rotate(180deg)}</style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">✦</span><div><strong>Lumina Retail</strong><small>Centro de operaciones</small></div></div>
      <nav id="navigation" aria-label="Navegación principal"></nav>
      <div class="sidebar-foot"><span>Estado de conexión</span><strong class="connected-label">● Conectado</strong><small>Actualizado el 17 nov 2026</small></div>
    </aside>
    <main class="main-content">
      <header class="topbar"><div><span class="eyebrow">Lumina Retail · Centro de control</span><h1 id="page-title">Resumen ejecutivo</h1></div><div class="top-actions"><div class="user-menu"><button class="user-button" id="user-button" aria-expanded="false" aria-label="Abrir menú de usuario"><span class="avatar">●</span></button><div class="user-popover" id="user-popover"><div class="popover-head"><strong>LMS</strong><span>Administrador de operaciones</span></div><button class="popover-action" id="refresh-menu"><span class="menu-symbol">↻</span>Actualizar datos</button></div></div></div></header>
      <div id="page-content"></div>
    </main>
  </div>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
